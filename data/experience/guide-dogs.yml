company: Guide Dogs for the Blind Association
title: My Sighted Guide Service Manager
start: 2012-04
end: 2016-05
sector: National disability charity
summary: >
  Manager of a central southern community service supporting people with a
  visual impairment and their families, overseeing staff and 45+ volunteers
  across a series of roles exceeding delivery targets year on year.

achievements:
  - title: Took the lead on national strategy and practice
    description: >-
      Defining clear eligibility criteria for the scheme, streamlining the
      volunteer recruitment process to deliver a high standard service within an
      excellent time frame, and devising and implementing person-centred quality
      assurance processes.
    impact: high
    tags: [strategy, governance, quality]

  - title: Business planned service delivery against budget
    description: >-
      Maximising stakeholder partnerships with a wide range of contacts across
      Hampshire, Wiltshire, Dorset, the Isle of Wight and the Channel Islands.
    impact: medium
    tags: [budget, planning, partnerships]

  - title: Created new multi-disciplinary team working approaches
    description: >-
      Working alongside local authority health and social care services following
      an extensive self-directed community engagement strategy.
    impact: medium
    tags: [partnerships, stakeholder, change]

  - title: Designed and delivered disability awareness training
    description: >-
      Training volunteers, carers, service providers and businesses, and
      marketing the service locally and nationally through case studies, press
      releases and presentations.
    impact: medium
    include_pdf: false
    tags: [training, communications]
