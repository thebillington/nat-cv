  - title: Providing programme governance
    description: >-
      Mobilising and managing Steering Groups, responsibility matrices, RAID
      logs, Terms of Reference and project plans with clear objectives,
      milestones and success measures.
    impact: high
    tags: [governance, assurance, risk]

  - title: Leading Barnardo's benefits management framework
    description: >-
      Implementing a consistent approach to benefits realisation and
